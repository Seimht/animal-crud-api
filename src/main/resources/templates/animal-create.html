<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <title>Create Animal</title>
</head>
<body>
<h1>Create New Animal</h1>
<form th:action="@{/api/animals/new}" th:object="${animal}" method="post">
    <label>Name:</label>
    <input type="text" th:field="*{name}" required/><br/>

    <label>Scientific Name:</label>
    <input type="text" th:field="*{scientificName}"/><br/>

    <label>Species:</label>
    <input type="text" th:field="*{species}" required/><br/>

    <label>Habitat:</label>
    <input type="text" th:field="*{habitat}" required/><br/>

    <label>Description:</label>
    <textarea th:field="*{description}"></textarea><br/>

    <button type="submit">Create</button>
</form>
</body>
</html>
