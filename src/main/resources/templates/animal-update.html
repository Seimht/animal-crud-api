<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:form="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="/styles/styles.css" type="text/css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <title>Animal Update</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light" style="background-color: #e3f2fd;">
    <a class="navbar-brand" href="/api/animals/all">
        <img src="/images/logo.jpg" alt="" width="80" height="60">
    </a>
    <ul class="nav justify-content-end">
        <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/api/animals/all">Home</a>
        </li>
    </ul>
</nav>

<div class="container mt-4">
    <h1>Animal Update</h1>
    <form action="/api/animals/update" method="post">
        <input type="number" id="animalId" name="animalId" class="form-control mb-3" data-th-value="${animal.animalId}" readonly/>

        <input type="text" id="name" name="name" class="form-control mb-3" placeholder="Name" data-th-value="${animal.name}" required/>

        <input type="text" id="scientificName" name="scientificName" class="form-control mb-3" placeholder="Scientific Name" data-th-value="${animal.scientificName}"/>

        <input type="text" id="species" name="species" class="form-control mb-3" placeholder="Species" data-th-value="${animal.species}" required/>

        <input type="text" id="habitat" name="habitat" class="form-control mb-3" placeholder="Habitat" data-th-value="${animal.habitat}" required/>

        <textarea id="description" name="description" class="form-control mb-3" placeholder="Description" data-th-text="${animal.description}"></textarea>

        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>
</body>
</html>
