<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Animal List</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light" style="background-color: #e3f2fd;">
    <a class="navbar-brand" href="/api/animals/all">
        <img src="/images/logo.jpg" alt="" width="80" height="60">
    </a>
    <ul class="nav justify-content-end">
        <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/api/animals/all">Home</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">Second</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">Third</a>
        </li>
    </ul>
</nav>

<div class="container mt-4">
    <h1 class="mb-4" data-th-text="${title}">Animal List</h1>

    <form action="/api/animals/search" method="get" class="mb-3">
        <input type="text" name="name" placeholder="Search by Name &#128270;" class="form-control">
    </form>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Species</th>
            <th>Habitat</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr data-th-each="animal : ${animalList}">
            <td><a data-th-href="@{/api/animals/{animalId}(animalId=${animal.animalId})}"
                   data-th-text="${animal.animalId}"></a></td>
            <td data-th-text="${animal.name}"></td>
            <td data-th-text="${animal.species}"></td>
            <td data-th-text="${animal.habitat}"></td>
            <td>
                <a th:href="@{/api/animals/update/{animalId}(animalId=${animal.animalId})}" class="btn btn-sm btn-warning">Update</a>
                <a th:href="@{/api/animals/delete/{animalId}(animalId=${animal.animalId})}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <button class="btn btn-outline-primary" onclick="openForm()">Create New Animal</button>

    <form id="new-animal" action="/api/animals/new" method="post" style="display:none" class="mt-3">
        <input type="text" name="name" placeholder="Name" class="form-control mb-2" required/>
        <input type="text" name="species" placeholder="Species" class="form-control mb-2" required/>
        <input type="text" name="habitat" placeholder="Habitat" class="form-control mb-2" required/>
        <input type="text" name="scientificName" placeholder="Scientific Name" class="form-control mb-2"/>
        <textarea name="description" placeholder="Description" class="form-control mb-2"></textarea>
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="reset" class="btn btn-danger" onclick="closeForm()">Cancel</button>
    </form>
</div>

<script>
    function openForm() {
        document.getElementById("new-animal").style.display = "block";
    }

    function closeForm() {
        document.getElementById("new-animal").style.display = "none";
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
